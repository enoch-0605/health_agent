spring:
  application:
    name: ai-agent
  profiles:
    active: local
  datasource:
    url: ${AI_AGENT_DB_URL:jdbc:postgresql://localhost:5432/ai_agent}
    username: ${AI_AGENT_DB_USERNAME:postgres}
    password: ${AI_AGENT_DB_PASSWORD:}
  ai:
    dashscope:
      api-key: ${AI_DASHSCOPE_API_KEY:${DASHSCOPE_API_KEY:}}

app:
  rag:
    # 开启后会在启动时调用嵌入模型加载本地健康知识库
    enabled: ${AI_AGENT_RAG_ENABLED:false}
    pgvector:
      enabled: ${AI_AGENT_PGVECTOR_ENABLED:false}

server:
  port: 8123
  servlet:
    context-path: /api
# springdoc-openapi项目配置
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs
  group-configs:
    - group: 'default'
      paths-to-match:
        - '/**'
      packages-to-scan:
        - ai_agent.controller
# knife4j的增强配置，不需要增强可以不配
knife4j:
  enable: true
  setting:
    language: zh_cn
